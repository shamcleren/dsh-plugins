name: Workbench checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            runtime/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir runtime install --frozen-lockfile --ignore-scripts
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes git-crypt gnupg
      - if: runner.os == 'macOS'
        run: brew install git-crypt gnupg
      - name: Install Chromium for browser tests
        if: runner.os == 'Linux'
        working-directory: plugins/saas-browser-workspace
        run: |
          pnpm exec playwright install --with-deps --only-shell chromium
          # The MCP integration tests also launch the Chromium pinned by @playwright/mcp.
          mcp_playwright_cli=$(node -e '
            const { createRequire } = require("node:module")
            const { dirname, resolve } = require("node:path")
            const fromMcp = createRequire(require.resolve("@playwright/mcp/package.json"))
            const manifest = fromMcp.resolve("playwright/package.json")
            console.log(resolve(dirname(manifest), require(manifest).bin.playwright))
          ')
          node "$mcp_playwright_cli" install --only-shell chromium
      - run: pnpm typecheck
      - if: runner.os == 'macOS'
        run: pnpm build
      - if: runner.os == 'Linux'
        run: pnpm -r --filter '!@shamcleren/dsh-pet' run build
      - run: pnpm test:bootstrap
      - run: pnpm --recursive --workspace-concurrency=1 run test
      - if: runner.os == 'macOS'
        run: pnpm test:macos
      - if: runner.os == 'Linux'
        run: node scripts/smoke-runtime.mjs runtime --startup-only
