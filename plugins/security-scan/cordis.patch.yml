- insert:
    - id: security-scan
      name: '@shamcleren/dsh-security-scan'
    - id: dsh-security-audit-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-security-audit
        name: 安全审计
        description: 原生 DSH 安全审计：只读扫描、证据复核、上下文压缩与 HTML 报告。
        order: 50
        plugins:
          - id: security-audit-tools
            name: '@shamcleren/dsh-security-scan/preset'

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
