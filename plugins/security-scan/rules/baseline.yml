{
  "rules": [
    {
      "id": "dsh-security.python-shell",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "Shell execution: verify untrusted input cannot reach the command.",
      "metadata": {
        "cwe": "CWE-78"
      },
      "pattern-either": [
        {
          "pattern": "subprocess.run(..., shell=True, ...)"
        },
        {
          "pattern": "subprocess.Popen(..., shell=True, ...)"
        },
        {
          "pattern": "subprocess.call(..., shell=True, ...)"
        },
        {
          "pattern": "subprocess.check_output(..., shell=True, ...)"
        }
      ]
    },
    {
      "id": "dsh-security.python-eval",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "Dynamic Python execution: trace the source of the executed value.",
      "metadata": {
        "cwe": "CWE-95"
      },
      "pattern-either": [
        {
          "pattern": "eval($CODE, ...)"
        },
        {
          "pattern": "exec($CODE, ...)"
        }
      ]
    },
    {
      "id": "dsh-security.python-pickle",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "Pickle deserialization: verify input is trusted before loading.",
      "metadata": {
        "cwe": "CWE-502"
      },
      "pattern-either": [
        {
          "pattern": "pickle.loads(...)"
        },
        {
          "pattern": "pickle.load(...)"
        }
      ]
    },
    {
      "id": "dsh-security.python-tls",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "TLS certificate verification is explicitly disabled.",
      "metadata": {
        "cwe": "CWE-295"
      },
      "pattern-either": [
        {
          "pattern": "requests.get(..., verify=False, ...)"
        },
        {
          "pattern": "requests.post(..., verify=False, ...)"
        },
        {
          "pattern": "requests.request(..., verify=False, ...)"
        }
      ]
    },
    {
      "id": "dsh-security.python-yaml",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "Unsafe YAML deserialization: verify trusted input or use a safe loader.",
      "metadata": {
        "cwe": "CWE-502"
      },
      "pattern-either": [
        {
          "pattern": "yaml.unsafe_load(...)"
        },
        {
          "pattern": "yaml.load(..., Loader=yaml.UnsafeLoader, ...)"
        }
      ]
    },
    {
      "id": "dsh-security.go-shell",
      "languages": [
        "go"
      ],
      "severity": "WARNING",
      "message": "Shell execution: trace the origin and validation of command text.",
      "metadata": {
        "cwe": "CWE-78"
      },
      "pattern-either": [
        {
          "pattern": "exec.Command(\"sh\", \"-c\", ...)"
        },
        {
          "pattern": "exec.Command(\"bash\", \"-c\", ...)"
        },
        {
          "pattern": "exec.CommandContext($CTX, \"sh\", \"-c\", ...)"
        }
      ]
    },
    {
      "id": "dsh-security.go-tls",
      "languages": [
        "go"
      ],
      "severity": "WARNING",
      "message": "TLS certificate verification is explicitly disabled.",
      "metadata": {
        "cwe": "CWE-295"
      },
      "pattern-either": [
        {
          "pattern": "tls.Config{..., InsecureSkipVerify: true, ...}"
        }
      ]
    },
    {
      "id": "dsh-security.go-sql",
      "languages": [
        "go"
      ],
      "severity": "WARNING",
      "message": "Formatted SQL query: confirm values use bind parameters.",
      "metadata": {
        "cwe": "CWE-89"
      },
      "pattern-either": [
        {
          "pattern": "$DB.Query(fmt.Sprintf(...), ...)"
        },
        {
          "pattern": "$DB.Exec(fmt.Sprintf(...), ...)"
        }
      ]
    },
    {
      "id": "dsh-security.js-eval",
      "languages": [
        "javascript",
        "typescript"
      ],
      "severity": "WARNING",
      "message": "Dynamic JavaScript execution: trace untrusted data before confirming a vulnerability.",
      "metadata": {
        "cwe": "CWE-95"
      },
      "pattern-either": [
        {
          "pattern": "eval($CODE)"
        },
        {
          "pattern": "new Function(...)"
        }
      ]
    },
    {
      "id": "dsh-security.js-shell",
      "languages": [
        "javascript",
        "typescript"
      ],
      "severity": "WARNING",
      "message": "Shell execution: verify command text cannot contain untrusted input.",
      "metadata": {
        "cwe": "CWE-78"
      },
      "pattern-either": [
        {
          "pattern": "child_process.exec(...)"
        },
        {
          "pattern": "child_process.execSync(...)"
        }
      ]
    },
    {
      "id": "dsh-security.js-tls",
      "languages": [
        "javascript",
        "typescript"
      ],
      "severity": "WARNING",
      "message": "TLS certificate verification is explicitly disabled.",
      "metadata": {
        "cwe": "CWE-295"
      },
      "pattern-either": [
        {
          "pattern": "{..., rejectUnauthorized: false, ...}"
        }
      ]
    },
    {
      "id": "dsh-security.js-html",
      "languages": [
        "javascript",
        "typescript"
      ],
      "severity": "WARNING",
      "message": "HTML sink: inspect sanitization and the source of the assigned value.",
      "metadata": {
        "cwe": "CWE-79"
      },
      "pattern-either": [
        {
          "pattern": "$ELEMENT.innerHTML = $HTML"
        }
      ]
    }
  ]
}
