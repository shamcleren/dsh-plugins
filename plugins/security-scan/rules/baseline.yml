{
  "rules": [
    {
      "id": "dsh-security.python-shell",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "Shell execution: verify untrusted input cannot reach the command.",
      "metadata": {
        "cwe": "CWE-78"
      },
      "patterns": [
        {
          "pattern-either": [
            {
              "pattern": "subprocess.$FN($CMD, ..., shell=True, ...)"
            },
            {
              "pattern": "os.system($CMD)"
            },
            {
              "pattern": "os.popen($CMD, ...)"
            }
          ]
        },
        {
          "pattern-not": "subprocess.$FN(\"...\", ..., shell=True, ...)"
        },
        {
          "pattern-not": "os.system(\"...\")"
        },
        {
          "pattern-not": "os.popen(\"...\", ...)"
        }
      ]
    },
    {
      "id": "dsh-security.python-eval",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "Dynamic Python execution: trace the source of the executed value.",
      "metadata": {
        "cwe": "CWE-95"
      },
      "patterns": [
        {
          "pattern-either": [
            {
              "pattern": "eval($CODE, ...)"
            },
            {
              "pattern": "exec($CODE, ...)"
            }
          ]
        },
        {
          "pattern-not": "eval(\"...\", ...)"
        },
        {
          "pattern-not": "exec(\"...\", ...)"
        }
      ]
    },
    {
      "id": "dsh-security.python-pickle",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "Pickle deserialization: verify input is trusted before loading.",
      "metadata": {
        "cwe": "CWE-502"
      },
      "pattern-either": [
        {
          "pattern": "pickle.loads(...)"
        },
        {
          "pattern": "pickle.load(...)"
        },
        {
          "pattern": "pickle.Unpickler(...)"
        }
      ]
    },
    {
      "id": "dsh-security.python-tls",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "TLS certificate verification is explicitly disabled.",
      "metadata": {
        "cwe": "CWE-295"
      },
      "pattern-either": [
        {
          "pattern": "requests.$FN(..., verify=False, ...)"
        },
        {
          "pattern": "httpx.$FN(..., verify=False, ...)"
        },
        {
          "pattern": "ssl._create_unverified_context(...)"
        }
      ]
    },
    {
      "id": "dsh-security.python-yaml",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "Unsafe YAML deserialization: verify trusted input or use a safe loader.",
      "metadata": {
        "cwe": "CWE-502"
      },
      "pattern-either": [
        {
          "pattern": "yaml.unsafe_load(...)"
        },
        {
          "pattern": "yaml.load(..., Loader=yaml.UnsafeLoader, ...)"
        },
        {
          "pattern": "yaml.load(..., Loader=yaml.Loader, ...)"
        }
      ]
    },
    {
      "id": "dsh-security.go-shell",
      "languages": [
        "go"
      ],
      "severity": "WARNING",
      "message": "Shell execution: trace the origin and validation of command text.",
      "metadata": {
        "cwe": "CWE-78"
      },
      "patterns": [
        {
          "pattern-either": [
            {
              "pattern": "exec.Command(\"sh\", \"-c\", ...)"
            },
            {
              "pattern": "exec.Command(\"bash\", \"-c\", ...)"
            },
            {
              "pattern": "exec.CommandContext($CTX, \"sh\", \"-c\", ...)"
            },
            {
              "pattern": "exec.CommandContext($CTX, \"bash\", \"-c\", ...)"
            }
          ]
        },
        {
          "pattern-not": "exec.Command(\"sh\", \"-c\", \"...\")"
        },
        {
          "pattern-not": "exec.Command(\"bash\", \"-c\", \"...\")"
        },
        {
          "pattern-not": "exec.CommandContext($CTX, \"sh\", \"-c\", \"...\")"
        },
        {
          "pattern-not": "exec.CommandContext($CTX, \"bash\", \"-c\", \"...\")"
        }
      ]
    },
    {
      "id": "dsh-security.go-tls",
      "languages": [
        "go"
      ],
      "severity": "WARNING",
      "message": "TLS certificate verification is explicitly disabled.",
      "metadata": {
        "cwe": "CWE-295"
      },
      "pattern-either": [
        {
          "pattern": "tls.Config{..., InsecureSkipVerify: true, ...}"
        }
      ]
    },
    {
      "id": "dsh-security.go-sql",
      "languages": [
        "go"
      ],
      "severity": "WARNING",
      "message": "Formatted SQL query: confirm values use bind parameters.",
      "metadata": {
        "cwe": "CWE-89"
      },
      "pattern-either": [
        {
          "patterns": [
            {
              "pattern": "$DB.$FN($QUERY, ...)"
            },
            {
              "metavariable-regex": {
                "metavariable": "$FN",
                "regex": "^(Query|QueryRow|Exec|Prepare|Raw|Where|Order|Group|Having)$"
              }
            },
            {
              "metavariable-pattern": {
                "metavariable": "$QUERY",
                "patterns": [
                  {
                    "pattern-either": [
                      {
                        "pattern": "fmt.Sprintf(...)"
                      },
                      {
                        "pattern": "\"...\" + $VALUE"
                      }
                    ]
                  },
                  {
                    "pattern-not": "\"...\" + \"...\""
                  }
                ]
              }
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern": "$DB.$FN($CTX, $QUERY, ...)"
            },
            {
              "metavariable-regex": {
                "metavariable": "$FN",
                "regex": "^(QueryContext|QueryRowContext|ExecContext|PrepareContext)$"
              }
            },
            {
              "metavariable-pattern": {
                "metavariable": "$QUERY",
                "patterns": [
                  {
                    "pattern-either": [
                      {
                        "pattern": "fmt.Sprintf(...)"
                      },
                      {
                        "pattern": "\"...\" + $VALUE"
                      }
                    ]
                  },
                  {
                    "pattern-not": "\"...\" + \"...\""
                  }
                ]
              }
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern-either": [
                {
                  "pattern-inside": "$QUERY := $BUILT\n...\n"
                },
                {
                  "pattern-inside": "$QUERY = $BUILT\n...\n"
                }
              ]
            },
            {
              "pattern": "$DB.$FN($QUERY, ...)"
            },
            {
              "metavariable-regex": {
                "metavariable": "$FN",
                "regex": "^(Query|QueryRow|Exec|Prepare|Raw|Where|Order|Group|Having)$"
              }
            },
            {
              "metavariable-pattern": {
                "metavariable": "$BUILT",
                "patterns": [
                  {
                    "pattern-either": [
                      {
                        "pattern": "fmt.Sprintf(...)"
                      },
                      {
                        "pattern": "\"...\" + $VALUE"
                      }
                    ]
                  },
                  {
                    "pattern-not": "\"...\" + \"...\""
                  }
                ]
              }
            }
          ]
        }
      ]
    },
    {
      "id": "dsh-security.js-eval",
      "languages": [
        "javascript",
        "typescript"
      ],
      "severity": "WARNING",
      "message": "Dynamic JavaScript execution: trace untrusted data before confirming a vulnerability.",
      "metadata": {
        "cwe": "CWE-95"
      },
      "patterns": [
        {
          "pattern-either": [
            {
              "pattern": "eval($CODE)"
            },
            {
              "pattern": "new Function(...)"
            },
            {
              "pattern": "vm.runInNewContext($CODE, ...)"
            },
            {
              "pattern": "vm.runInThisContext($CODE, ...)"
            },
            {
              "pattern": "vm.runInContext($CODE, ...)"
            },
            {
              "pattern": "new vm.Script($CODE, ...)"
            }
          ]
        },
        {
          "pattern-not": "eval(\"...\")"
        },
        {
          "pattern-not": "vm.runInNewContext(\"...\", ...)"
        },
        {
          "pattern-not": "vm.runInThisContext(\"...\", ...)"
        },
        {
          "pattern-not": "vm.runInContext(\"...\", ...)"
        }
      ]
    },
    {
      "id": "dsh-security.js-shell",
      "languages": [
        "javascript",
        "typescript"
      ],
      "severity": "WARNING",
      "message": "Shell execution: verify command text cannot contain untrusted input.",
      "metadata": {
        "cwe": "CWE-78"
      },
      "patterns": [
        {
          "pattern-either": [
            {
              "pattern": "child_process.exec($CMD, ...)"
            },
            {
              "pattern": "child_process.execSync($CMD, ...)"
            },
            {
              "pattern": "child_process.spawn($CMD, $ARGS, {..., shell: true, ...})"
            },
            {
              "pattern": "child_process.spawnSync($CMD, $ARGS, {..., shell: true, ...})"
            }
          ]
        },
        {
          "pattern-not": "child_process.exec(\"...\", ...)"
        },
        {
          "pattern-not": "child_process.execSync(\"...\", ...)"
        }
      ]
    },
    {
      "id": "dsh-security.js-tls",
      "languages": [
        "javascript",
        "typescript"
      ],
      "severity": "WARNING",
      "message": "TLS certificate verification is explicitly disabled.",
      "metadata": {
        "cwe": "CWE-295"
      },
      "pattern-either": [
        {
          "pattern": "{..., rejectUnauthorized: false, ...}"
        },
        {
          "pattern": "process.env.NODE_TLS_REJECT_UNAUTHORIZED = \"0\""
        }
      ]
    },
    {
      "id": "dsh-security.js-html",
      "languages": [
        "javascript",
        "typescript"
      ],
      "severity": "WARNING",
      "message": "HTML sink: inspect sanitization and the source of the assigned value.",
      "metadata": {
        "cwe": "CWE-79"
      },
      "patterns": [
        {
          "pattern-either": [
            {
              "pattern": "$ELEMENT.innerHTML = $HTML"
            },
            {
              "pattern": "$ELEMENT.outerHTML = $HTML"
            },
            {
              "pattern": "$ELEMENT.insertAdjacentHTML($WHERE, $HTML)"
            },
            {
              "pattern": "document.write($HTML)"
            },
            {
              "pattern": "{__html: $HTML}"
            }
          ]
        },
        {
          "pattern-not": "$ELEMENT.innerHTML = \"...\""
        },
        {
          "pattern-not": "$ELEMENT.outerHTML = \"...\""
        },
        {
          "pattern-not": "$ELEMENT.insertAdjacentHTML($WHERE, \"...\")"
        },
        {
          "pattern-not": "document.write(\"...\")"
        },
        {
          "pattern-not": "{__html: \"...\"}"
        },
        {
          "pattern-not": "$ELEMENT.innerHTML = DOMPurify.sanitize(...)"
        },
        {
          "pattern-not": "$ELEMENT.insertAdjacentHTML($WHERE, DOMPurify.sanitize(...))"
        },
        {
          "pattern-not": "{__html: DOMPurify.sanitize(...)}"
        }
      ]
    },
    {
      "id": "dsh-security.python-sql",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "SQL text built with an f-string, % formatting, format() or concatenation: confirm values use bind parameters.",
      "metadata": {
        "cwe": "CWE-89"
      },
      "pattern-either": [
        {
          "patterns": [
            {
              "pattern-either": [
                {
                  "pattern": "$CUR.execute($QUERY, ...)"
                },
                {
                  "pattern": "$CUR.executemany($QUERY, ...)"
                },
                {
                  "pattern": "$MODEL.objects.raw($QUERY, ...)"
                },
                {
                  "pattern": "sqlalchemy.text($QUERY)"
                }
              ]
            },
            {
              "metavariable-pattern": {
                "metavariable": "$QUERY",
                "patterns": [
                  {
                    "pattern-either": [
                      {
                        "pattern": "f\"...\""
                      },
                      {
                        "pattern": "\"...\" % $VALUE"
                      },
                      {
                        "pattern": "\"...\".format(...)"
                      },
                      {
                        "pattern": "\"...\" + $VALUE"
                      }
                    ]
                  },
                  {
                    "pattern-not": "\"...\" + \"...\""
                  }
                ]
              }
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern-inside": "$QUERY = $BUILT\n..."
            },
            {
              "pattern-either": [
                {
                  "pattern": "$CUR.execute($QUERY, ...)"
                },
                {
                  "pattern": "$CUR.executemany($QUERY, ...)"
                },
                {
                  "pattern": "$MODEL.objects.raw($QUERY, ...)"
                },
                {
                  "pattern": "sqlalchemy.text($QUERY)"
                }
              ]
            },
            {
              "metavariable-pattern": {
                "metavariable": "$BUILT",
                "patterns": [
                  {
                    "pattern-either": [
                      {
                        "pattern": "f\"...\""
                      },
                      {
                        "pattern": "\"...\" % $VALUE"
                      },
                      {
                        "pattern": "\"...\".format(...)"
                      },
                      {
                        "pattern": "\"...\" + $VALUE"
                      }
                    ]
                  },
                  {
                    "pattern-not": "\"...\" + \"...\""
                  }
                ]
              }
            }
          ]
        }
      ]
    },
    {
      "id": "dsh-security.python-template",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "Template source built at runtime: user-controlled template text can execute server-side expressions.",
      "metadata": {
        "cwe": "CWE-1336"
      },
      "patterns": [
        {
          "pattern-either": [
            {
              "pattern": "flask.render_template_string($TEMPLATE, ...)"
            },
            {
              "pattern": "jinja2.Template($TEMPLATE, ...)"
            },
            {
              "pattern": "jinja2.Environment(...).from_string($TEMPLATE, ...)"
            }
          ]
        },
        {
          "pattern-not": "flask.render_template_string(\"...\", ...)"
        },
        {
          "pattern-not": "jinja2.Template(\"...\", ...)"
        },
        {
          "pattern-not": "jinja2.Environment(...).from_string(\"...\", ...)"
        }
      ]
    },
    {
      "id": "dsh-security.python-html",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "Value marked as safe HTML bypasses template escaping: confirm it cannot contain user content.",
      "metadata": {
        "cwe": "CWE-79"
      },
      "patterns": [
        {
          "pattern-either": [
            {
              "pattern": "django.utils.safestring.mark_safe($HTML)"
            },
            {
              "pattern": "django.utils.safestring.SafeString($HTML)"
            },
            {
              "pattern": "markupsafe.Markup($HTML)"
            },
            {
              "pattern": "flask.Markup($HTML)"
            }
          ]
        },
        {
          "pattern-not": "django.utils.safestring.mark_safe(\"...\")"
        },
        {
          "pattern-not": "django.utils.safestring.SafeString(\"...\")"
        },
        {
          "pattern-not": "markupsafe.Markup(\"...\")"
        },
        {
          "pattern-not": "flask.Markup(\"...\")"
        }
      ]
    },
    {
      "id": "dsh-security.python-debug",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "Flask debug mode enables the interactive Werkzeug debugger; never expose it outside local development.",
      "metadata": {
        "cwe": "CWE-489"
      },
      "patterns": [
        {
          "pattern-inside": "$APP = flask.Flask(...)\n..."
        },
        {
          "pattern": "$APP.run(..., debug=True, ...)"
        }
      ]
    },
    {
      "id": "dsh-security.python-jwt",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "JWT signature verification is disabled or the none algorithm is accepted.",
      "metadata": {
        "cwe": "CWE-347"
      },
      "pattern-either": [
        {
          "pattern": "jwt.decode(..., options={..., \"verify_signature\": False, ...}, ...)"
        },
        {
          "pattern": "jwt.decode(..., verify=False, ...)"
        },
        {
          "pattern": "jwt.decode(..., algorithms=[..., \"none\", ...], ...)"
        }
      ]
    },
    {
      "id": "dsh-security.python-ssrf",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "Server-side request to a request-controlled URL: enforce an allowed destination policy.",
      "metadata": {
        "cwe": "CWE-918"
      },
      "mode": "taint",
      "pattern-sources": [
        {
          "pattern": "flask.request.$ATTR"
        },
        {
          "pattern": "flask.request.get_json(...)"
        },
        {
          "patterns": [
            {
              "pattern": "$REQ.$PART"
            },
            {
              "metavariable-regex": {
                "metavariable": "$REQ",
                "regex": "^(self\\.)?request$"
              }
            },
            {
              "metavariable-regex": {
                "metavariable": "$PART",
                "regex": "^(GET|POST|COOKIES|FILES|META|body|data|query_params|headers)$"
              }
            }
          ]
        }
      ],
      "pattern-sanitizers": [
        {
          "patterns": [
            {
              "pattern": "$EXPR"
            },
            {
              "metavariable-regex": {
                "metavariable": "$EXPR",
                "regex": "^f?[\"'`]https?://[^/\"'`{$]+/"
              }
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern-either": [
                {
                  "pattern": "$MAP[...]"
                },
                {
                  "pattern": "$MAP.get(...)"
                }
              ]
            },
            {
              "metavariable-regex": {
                "metavariable": "$MAP",
                "regex": "^[A-Z][A-Z0-9_]*$"
              }
            }
          ]
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern-either": [
                {
                  "pattern": "requests.$FN($SINK, ...)"
                },
                {
                  "pattern": "requests.request($METHOD, $SINK, ...)"
                },
                {
                  "pattern": "httpx.$FN($SINK, ...)"
                },
                {
                  "pattern": "urllib.request.urlopen($SINK, ...)"
                }
              ]
            },
            {
              "focus-metavariable": "$SINK"
            }
          ]
        }
      ]
    },
    {
      "id": "dsh-security.python-path",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "File path built from request input: confirm the resolved path stays inside the intended directory.",
      "metadata": {
        "cwe": "CWE-22"
      },
      "mode": "taint",
      "pattern-sources": [
        {
          "pattern": "flask.request.$ATTR"
        },
        {
          "pattern": "flask.request.get_json(...)"
        },
        {
          "patterns": [
            {
              "pattern": "$REQ.$PART"
            },
            {
              "metavariable-regex": {
                "metavariable": "$REQ",
                "regex": "^(self\\.)?request$"
              }
            },
            {
              "metavariable-regex": {
                "metavariable": "$PART",
                "regex": "^(GET|POST|COOKIES|FILES|META|body|data|query_params|headers)$"
              }
            }
          ]
        }
      ],
      "pattern-sanitizers": [
        {
          "pattern": "os.path.basename(...)"
        },
        {
          "pattern": "werkzeug.utils.secure_filename(...)"
        },
        {
          "patterns": [
            {
              "pattern-inside": "if not $X.startswith(...):\n    ...\n..."
            },
            {
              "pattern": "$X"
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern-inside": "if not $X.is_relative_to(...):\n    ...\n..."
            },
            {
              "pattern": "$X"
            }
          ]
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern-either": [
                {
                  "pattern": "open($SINK, ...)"
                },
                {
                  "pattern": "flask.send_file($SINK, ...)"
                },
                {
                  "pattern": "os.remove($SINK)"
                },
                {
                  "pattern": "shutil.rmtree($SINK, ...)"
                }
              ]
            },
            {
              "focus-metavariable": "$SINK"
            }
          ]
        }
      ]
    },
    {
      "id": "dsh-security.python-redirect",
      "languages": [
        "python"
      ],
      "severity": "WARNING",
      "message": "Redirect target controlled by the request: restrict it to same-site paths or an allow list.",
      "metadata": {
        "cwe": "CWE-601"
      },
      "mode": "taint",
      "pattern-sources": [
        {
          "pattern": "flask.request.$ATTR"
        },
        {
          "pattern": "flask.request.get_json(...)"
        },
        {
          "patterns": [
            {
              "pattern": "$REQ.$PART"
            },
            {
              "metavariable-regex": {
                "metavariable": "$REQ",
                "regex": "^(self\\.)?request$"
              }
            },
            {
              "metavariable-regex": {
                "metavariable": "$PART",
                "regex": "^(GET|POST|COOKIES|FILES|META|body|data|query_params|headers)$"
              }
            }
          ]
        }
      ],
      "pattern-sanitizers": [
        {
          "patterns": [
            {
              "pattern": "$EXPR"
            },
            {
              "metavariable-regex": {
                "metavariable": "$EXPR",
                "regex": "^f?[\"'`]/[^/\\\\\"'`]"
              }
            }
          ]
        },
        {
          "patterns": [
            {
              "pattern-either": [
                {
                  "pattern": "$MAP[...]"
                },
                {
                  "pattern": "$MAP.get(...)"
                }
              ]
            },
            {
              "metavariable-regex": {
                "metavariable": "$MAP",
                "regex": "^[A-Z][A-Z0-9_]*$"
              }
            }
          ]
        },
        {
          "pattern": "flask.url_for(...)"
        },
        {
          "patterns": [
            {
              "pattern-either": [
                {
                  "pattern-inside": "if url_has_allowed_host_and_scheme($X, ...):\n    ..."
                },
                {
                  "pattern-inside": "if not url_has_allowed_host_and_scheme($X, ...):\n    ...\n..."
                }
              ]
            },
            {
              "pattern": "$X"
            }
          ]
        }
      ],
      "pattern-sinks": [
        {
          "patterns": [
            {
              "pattern-either": [
                {
                  "pattern": "flask.redirect($SINK, ...)"
                },
                {
                  "pattern": "django.shortcuts.redirect($SINK, ...)"
                },
                {
                  "pattern": "django.http.HttpResponseRedirect($SINK, ...)"
                }
              ]
            },
            {
              "focus-metavariable": "$SINK"
            }
          ]
        }
      ]
    },
    {
      "id": "dsh-security.js-sql",
      "languages": [
        "javascript",
        "typescript"
      ],
      "severity": "WARNING",
      "message": "SQL text built with concatenation or template interpolation: confirm values use bind parameters.",
      "metadata": {
        "cwe": "CWE-89"
      },
      "pattern-either": [
        {
          "patterns": [
